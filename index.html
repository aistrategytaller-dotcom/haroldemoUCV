<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harol Alejandria</title>
  <style>
    body { font-family: Calibri, Arial, sans-serif; margin: 0; background: #f7fafc; color: #1f2d3d; text-align: center; padding: 80px 24px; }
    h1 { color: #051c2c; font-size: 2.4rem; }
    p { font-size: 1.2rem; }
    .boton-comenzar { margin-top: 32px; padding: 14px 36px; font-size: 1.1rem; font-family: inherit; color: #ffffff; background: #1e6fd9; border: none; border-radius: 8px; cursor: pointer; }
    .boton-comenzar:hover { background: #1858b0; }
    .tabla-animo { margin: 24px auto 0; width: 100%; max-width: 760px; border-collapse: separate; border-spacing: 0; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 16px rgba(5, 28, 44, 0.12); }
    .tabla-animo th { background: #051c2c; color: #ffffff; font-weight: 600; padding: 14px 16px; text-align: center; }
    .tabla-animo td { padding: 12px 16px; text-align: center; border-top: 1px solid #e3e9f0; }
    .tabla-animo tbody tr:nth-child(even) td { background: #f2f6fa; }
    .tabla-animo tbody tr:hover td { background: #e6eef7; }
  </style>
</head>
<body>
  <h1>Harol Alejandria</h1>
  <p>Hackathon de Salud Mental con IA · UCV</p>
  <p>Pídele a Claude que cambie esta página.</p>
  <p id="fecha-actual"></p>
  <button class="boton-comenzar">Comenzar</button>
  <button class="boton-comenzar">Primera hackathon con IA</button>
  <h2>Formulario de estado de ánimo</h2>
  <form id="form-animo">
    <label>Nombre ficticio
      <input type="text" id="nombre" value="Persona Ficticia 1" required>
    </label>
    <fieldset>
      <legend>Estado de ánimo (1 = muy bajo, 5 = muy bueno)</legend>
      <label><input type="radio" name="estado" value="1"> 1</label>
      <label><input type="radio" name="estado" value="2"> 2</label>
      <label><input type="radio" name="estado" value="3"> 3</label>
      <label><input type="radio" name="estado" value="4"> 4</label>
      <label><input type="radio" name="estado" value="5"> 5</label>
    </fieldset>
    <label>Nota
      <textarea id="nota" rows="3"></textarea>
    </label>
    <button type="submit" class="boton-comenzar">Enviar</button>
  </form>
  <h2>Registros guardados</h2>
  <table class="tabla-animo">
    <thead>
      <tr><th>Nombre</th><th>Estado de ánimo</th><th>Nota</th></tr>
    </thead>
    <tbody id="lista-registros"></tbody>
  </table>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://qchqxqhwjqoycrzvqpoi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_cdEQ4VfkmyXsQd9hSU3Y2Q_5VzAJJUC';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function cargarRegistros() {
      const { data, error } = await supabase
        .from('registros_animo')
        .select('*')
        .order('created_at', { ascending: false });
      const lista = document.getElementById('lista-registros');
      lista.innerHTML = '';
      if (error) {
        lista.innerHTML = '<tr><td colspan="3">No se pudieron cargar los registros: ' + error.message + '</td></tr>';
        return;
      }
      for (const r of data) {
        const fila = document.createElement('tr');
        for (const valor of [r.nombre, r.estado_animo, r.nota || 'sin nota']) {
          const celda = document.createElement('td');
          celda.textContent = valor;
          fila.appendChild(celda);
        }
        lista.appendChild(fila);
      }
    }

    document.getElementById('form-animo').addEventListener('submit', async (e) => {
      e.preventDefault();
      const seleccion = document.querySelector('input[name="estado"]:checked');
      if (!seleccion) {
        alert('Selecciona un estado de ánimo del 1 al 5.');
        return;
      }
      const { error } = await supabase.from('registros_animo').insert({
        nombre: document.getElementById('nombre').value,
        estado_animo: Number(seleccion.value),
        nota: document.getElementById('nota').value
      });
      if (error) {
        alert('No se pudo guardar: ' + error.message);
        return;
      }
      e.target.reset();
      document.getElementById('nombre').value = 'Persona Ficticia 1';
      cargarRegistros();
    });

    cargarRegistros();
  </script>
  <script>
    document.getElementById('fecha-actual').textContent = new Date().toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  </script>
</body>
</html>
